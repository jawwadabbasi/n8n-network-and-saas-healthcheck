        "language": "python",
        "pythonCode": "results = []\n\nfor item in items:\n    stdout = item.get(\"json\", {}).get(\"stdout\", \"\") or \"\"\n    stderr = item.get(\"json\", {}).get(\"stderr\", \"\") or \"\"\n\n    # Support structured input OR flattened input\n    info = item.get(\"json\", {}).get(\"item\", item.get(\"json\", {}))\n\n    name = info.get(\"name\", \"Unknown\")\n    ip = info.get(\"ip\", \"Unknown\")\n    port = info.get(\"port\", \"Unknown\")\n\n    # Determine status using stderr checks\n    if (\"succeeded\" in stderr) or (\"open\" in stderr):\n        status = \"OPEN\"\n    else:\n        status = \"CLOSED\"\n\n    results.append({\n        \"name\": name,\n        \"ip\": ip,\n        \"port\": port,\n        \"status\": status\n    })\n\nreturn {\"port_results\": results}"
      },
