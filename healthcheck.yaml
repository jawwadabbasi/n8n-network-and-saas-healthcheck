      "parameters": {
        "language": "python",
        "pythonCode": "results = []\n\nERROR_KEYS = [\"error\", \"errors\", \"error_message\", \"error_description\"]\nNEGATIVE_STATUS = [\"error\", \"failed\", \"fail\", \"denied\", \"forbidden\", \"unauthorized\"]\n\nfor item in _input.all():\n    data = item.json or {}\n\n    name = data.get(\"name\", \"Unknown\")\n    url = data.get(\"url\", \"Unknown\")\n    response = data.get(\"results\") or data.get(\"result\") or {}\n    http_status = data.get(\"results\", {}).get(\"statusCode\", {})\n    display_results = data.get(\"display_results\", \"full\")\n    headers = data.get(\"results\", {}).get(\"headers\", {})\n\n    # -------------------------------\n    # SUCCESS / FAILURE DETECTION\n    # -------------------------------\n    success = True\n    error_message = None\n\n    # Rule 1: n8n HTTP error\n    if data.get(\"error\") or data.get(\"errorMessage\"):\n        success = False\n        error_message = data.get(\"error\") or data.get(\"errorMessage\")\n\n    # Rule 2: HTTP status code\n    if isinstance(http_status, int) and http_status >= 400:\n        success = False\n        error_message = f\"HTTP {http_status}\"\n\n    # Rule 3: Look for explicit API error fields\n    for key in ERROR_KEYS:\n        if key in response:\n            success = False\n            error_message = response.get(key)\n\n    # Rule 4: Known failure patterns\n    status_field = str(response.get(\"status\", \"\")).lower()\n    if status_field in NEGATIVE_STATUS:\n        success = False\n        error_message = response.get(\"status\")\n\n    # Rule 5: Some APIs send \"success\": false\n    if response.get(\"success\") is False:\n        success = False\n        error_message = \"success = false\"\n\n    # Rule 6: Empty response\n    if not response:\n        success = False\n        error_message = \"Empty response\"\n\n    if display_results == \"full\":\n        final_response = response\n\n    elif display_results == \"headers\":\n        final_response = {\"headers\": headers}\n\n    elif display_results == \"status_code\":\n        final_response = {\"statusCode\": http_status}\n\n    results.append({\n        \"name\": name,\n        \"url\": url,\n        \"success\": success,\n        \"error\": None if success else error_message,\n        \"response\": final_response,\n    })\n\nreturn {\"api_responses\": results}"
      },
